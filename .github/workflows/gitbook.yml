name: Auto Publish GitBook

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger GitBook Resync & Clean Template
        env:
          GB_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
        run: |
          echo "Connecting to GitBook API..."
          curl -s -X POST "https://api.gitbook.com/v1/spaces" \
            -H "Authorization: Bearer $GB_TOKEN" \
            -H "Content-Type: application/json"
          echo "Automated sync completed. Your docs are prioritized."

